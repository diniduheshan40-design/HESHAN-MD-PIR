<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>HESHAN-MD | Pair Code</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background: radial-gradient(circle at top, #1e1b4b, #030712);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(239, 68, 68, 0.25);
      border-radius: 20px;
      padding: 35px 28px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.2);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 14px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      border-radius: 20px;
      color: #f87171;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
    }
    h1 span { color: #ef4444; }
    p.sub {
      font-size: 0.85rem;
      color: #9ca3af;
      margin-bottom: 25px;
    }
    .input-box {
      text-align: left;
      margin-bottom: 18px;
    }
    .input-box label {
      font-size: 0.8rem;
      color: #d1d5db;
      display: block;
      margin-bottom: 6px;
    }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-wrapper i {
      position: absolute;
      left: 14px;
      color: #6b7280;
    }
    .input-wrapper input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: #0b0f19;
      border: 1px solid #374151;
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: 0.2s border;
    }
    .input-wrapper input:focus {
      border-color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
    }
    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s transform;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
    }
    button:hover {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      transform: translateY(-1px);
    }
    button:disabled {
      background: #4b5563;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    #code-area {
      display: none;
      margin-top: 25px;
      padding: 18px;
      background: #030712;
      border: 1px dashed #ef4444;
      border-radius: 12px;
    }
    .code-text {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: 5px;
      color: #38bdf8;
      cursor: pointer;
      user-select: all;
    }
    .code-note {
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 8px;
      line-height: 1.4;
    }
    .copy-status {
      font-size: 0.75rem;
      color: #10b981;
      margin-top: 4px;
      display: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="badge">OFFICIAL PAIR SITE</div>
    <h1>HESHAN <span>MD</span></h1>
    <p class="sub">Enter your phone number with country code</p>

    <div class="input-box">
      <label for="num">Phone Number (No '+' or spaces)</label>
      <div class="input-wrapper">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="num" placeholder="94701234567" />
      </div>
    </div>

    <button id="btn" onclick="requestPairCode()">GET PAIRING CODE</button>

    <div id="code-area">
      <div id="code-val" class="code-text" title="Click to Copy"></div>
      <div id="copy-msg" class="copy-status"><i class="fa-solid fa-check"></i> Code Copied!</div>
      <div class="code-note">
        Click code to copy. Open <b>WhatsApp > Linked Devices > Link with phone number</b> and enter it quickly.
      </div>
    </div>
  </div>

  <script>
    // Server keep-alive ping
    setInterval(() => {
      fetch('/ping').catch(() => {});
    }, 25000);

    async function requestPairCode() {
      const numInput = document.getElementById('num');
      const btn = document.getElementById('btn');
      const codeArea = document.getElementById('code-area');
      const codeVal = document.getElementById('code-val');
      const copyMsg = document.getElementById('copy-msg');

      const phone = numInput.value.replace(/[^0-9]/g, '');
      if (phone.length < 10) {
        alert('කරුණාකර නිවැරදි Phone Number එකක් දෙන්න (eg: 947xxxxxxxx)');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'GENERATING CODE...';
      codeArea.style.display = 'none';
      copyMsg.style.display = 'none';

      try {
        const response = await fetch(`/code?number=${encodeURIComponent(phone)}`);
        const data = await response.json();

        if (data.code) {
          codeVal.innerText = data.code;
          codeArea.style.display = 'block';
        } else {
          alert(data.error || 'Code generate කිරීමට නොහැකි විය. නැවත උත්සාහ කරන්න.');
        }
      } catch (err) {
        alert('Server timeout or Network Error. කරුණාකර නැවත උත්සාහ කරන්න.');
      } finally {
        btn.disabled = false;
        btn.innerText = 'GET PAIRING CODE';
      }
    }

    document.getElementById('code-val').addEventListener('click', function() {
      const rawCode = this.innerText.replace(/-/g, '');
      navigator.clipboard.writeText(rawCode).then(() => {
        const msg = document.getElementById('copy-msg');
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      });
    });
  </script>
</body>
</html>
