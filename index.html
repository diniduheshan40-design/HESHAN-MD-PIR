<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HESHAN-MD | PAIR CODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --primary: #ef4444;
      --primary-glow: rgba(239, 68, 68, 0.4);
      --accent: #38bdf8;
      --bg-dark: #07090e;
      --card-bg: rgba(15, 23, 42, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --text: #f8fafc;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.1) 0px, transparent 50%);
      color: var(--text);
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 999px;
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .badge i {
      font-size: 0.7rem;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    h1 span {
      color: var(--primary);
      text-shadow: 0 0 15px var(--primary-glow);
    }

    .desc {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 24px;
    }

    .input-group {
      text-align: left;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-field {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-field i {
      position: absolute;
      left: 14px;
      color: #64748b;
      font-size: 0.95rem;
    }

    input {
      width: 100%;
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 14px 14px 14px 42px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px var(--primary-glow);
      transition: all 0.2s ease;
    }

    button:hover {
      background: linear-gradient(135deg, #dc2626, #991b1b);
      transform: translateY(-1px);
    }

    button:disabled {
      background: #334155;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #result-box {
      display: none;
      margin-top: 24px;
      padding: 20px;
      background: #090d16;
      border: 1px dashed var(--accent);
      border-radius: 14px;
    }

    .code-label {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .code-display {
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 6px;
      cursor: pointer;
      user-select: all;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
      display: inline-block;
      margin-bottom: 4px;
    }

    .copy-alert {
      display: none;
      font-size: 0.75rem;
      color: #34d399;
      font-weight: 600;
      margin-top: 4px;
    }

    .instruction {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 10px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">
      <i class="fa-solid fa-bolt"></i> Official Pairing Tool
    </div>
    <h1>HESHAN <span>MD</span></h1>
    <p class="desc">Enter your WhatsApp number with country code</p>

    <div class="input-group">
      <label for="phone">Phone Number</label>
      <div class="input-field">
        <i class="fa-solid fa-phone"></i>
        <input type="text" id="phone" placeholder="94701234567" autocomplete="off" />
      </div>
    </div>

    <button id="get-btn" onclick="fetchPairCode()">
      <i class="fa-solid fa-key"></i> GET PAIR CODE
    </button>

    <div id="result-box">
      <div class="code-label">Click to Copy Code</div>
      <div id="code" class="code-display" title="Click to copy"></div>
      <div id="copy-msg" class="copy-alert"><i class="fa-solid fa-check"></i> Copied to clipboard!</div>
      <p class="instruction">
        Open <b>WhatsApp > Linked Devices > Link with phone number</b> and paste the code immediately.
      </p>
    </div>
  </div>

  <script>
    // Keep server active
    setInterval(() => {
      fetch('/ping').catch(() => {});
    }, 25000);

    async function fetchPairCode() {
      const input = document.getElementById('phone');
      const btn = document.getElementById('get-btn');
      const box = document.getElementById('result-box');
      const codeField = document.getElementById('code');
      const copyMsg = document.getElementById('copy-msg');

      const rawNum = input.value.replace(/[^0-9]/g, '');

      if (rawNum.length < 10) {
        alert('කරුණාකර රටේ කෝඩ් එකත් එක්ක නිවැරදි number එකක් දෙන්න (eg: 947xxxxxxxx)');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERATING...';
      box.style.display = 'none';
      copyMsg.style.display = 'none';

      try {
        const res = await fetch(`/code?number=${encodeURIComponent(rawNum)}`);
        const data = await res.json();

        if (data.code) {
          codeField.innerText = data.code;
          box.style.display = 'block';
        } else {
          alert(data.error || 'Code generate කිරීමට නොහැකි විය. කරුණාකර නැවත උත්සාහ කරන්න.');
        }
      } catch (e) {
        alert('Server connection timeout. කරුණාකර තත්පර කිහිපයකින් නැවත උත්සාහ කරන්න.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-key"></i> GET PAIR CODE';
      }
    }

    document.getElementById('code').addEventListener('click', function() {
      const pureCode = this.innerText.replace(/-/g, '');
      navigator.clipboard.writeText(pureCode).then(() => {
        const copyMsg = document.getElementById('copy-msg');
        copyMsg.style.display = 'block';
        setTimeout(() => { copyMsg.style.display = 'none'; }, 2500);
      });
    });
  </script>
</body>
</html>
