<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HESHAN-MD | PAIRING</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #ff003c;
            --dark-red: #590015;
            --bg: #070709;
            --card: rgba(18, 10, 14, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            background-image: radial-gradient(circle at center, rgba(255, 0, 60, 0.12) 0%, transparent 70%);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 0, 60, 0.35);
            border-radius: 20px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 0 35px rgba(255, 0, 60, 0.2);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            color: #fff;
            text-shadow: 0 0 10px var(--red);
            margin-bottom: 5px;
        }

        .tag {
            display: inline-block;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            color: var(--red);
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid rgba(255, 0, 60, 0.3);
            padding: 3px 12px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        p { color: #888; font-size: 14px; margin-bottom: 20px; }

        input {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 0, 60, 0.35);
            border-radius: 10px;
            color: #fff;
            font-size: 17px;
            font-family: 'Rajdhani', sans-serif;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--red);
            box-shadow: 0 0 12px rgba(255, 0, 60, 0.5);
        }

        button.btn-main {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #ff003c, #990024);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.4);
            transition: 0.3s;
        }

        button.btn-main:hover {
            box-shadow: 0 0 25px rgba(255, 0, 60, 0.7);
            transform: translateY(-2px);
        }

        button:disabled {
            background: #2a1117;
            color: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .result-panel {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px dashed var(--red);
            border-radius: 12px;
            padding: 15px;
        }

        .pair-code {
            font-family: 'Orbitron', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: #ff2a5f;
            letter-spacing: 5px;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 0, 60, 0.6);
        }

        .copy-btn {
            background: rgba(255, 0, 60, 0.2);
            border: 1px solid var(--red);
            color: #fff;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Rajdhani', sans-serif;
        }

        .copy-btn:hover { background: var(--red); }

        .loading-text {
            font-size: 13px;
            color: #00ffaa;
            margin-top: 10px;
            animation: pulse 1.2s infinite;
        }

        .session-panel {
            display: none;
            margin-top: 20px;
            background: rgba(0, 255, 170, 0.05);
            border: 1px solid #00ffaa;
            border-radius: 12px;
            padding: 15px;
        }

        textarea {
            width: 100%;
            height: 90px;
            background: #050b08;
            border: 1px solid #00ffaa;
            color: #00ffaa;
            font-family: monospace;
            font-size: 11px;
            padding: 8px;
            border-radius: 6px;
            margin: 10px 0;
            resize: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="box">
    <h1>HESHAN-MD</h1>
    <div class="tag">OFFICIAL PAIRING SYSTEM</div>
    <p>WhatsApp අංකය Country code එක සමඟ ඇතුළත් කරන්න.</p>

    <input type="text" id="phone" placeholder="9471xxxxxxx">
    <button class="btn-main" id="getBtn" onclick="getCode()">PAIR WITH WHATSAPP</button>

    <!-- Code Display -->
    <div class="result-panel" id="codePanel">
        <div style="font-size: 11px; color: #888;">ENTER THIS IN WHATSAPP:</div>
        <div class="pair-code" id="codeText">--------</div>
        <button class="copy-btn" id="copyCodeBtn" onclick="copyCode()">COPY CODE</button>
        <div class="loading-text" id="loader">⏳ WhatsApp එකෙන් Link වෙනතුරු රැඳී සිටින්න...</div>
    </div>

    <!-- Live Session Box -->
    <div class="session-panel" id="sessionPanel">
        <div style="color: #00ffaa; font-weight: bold; font-size: 13px;">✅ SUCCESS! SESSION GENERATED</div>
        <textarea id="sessionVal" readonly></textarea>
        <button class="btn-main" style="background: #00ffaa; color: #000;" onclick="copySession()">COPY SESSION ID</button>
    </div>
</div>

<script>
let timer = null;

async function getCode() {
    const input = document.getElementById('phone');
    const btn = document.getElementById('getBtn');
    const codePanel = document.getElementById('codePanel');
    const codeText = document.getElementById('codeText');

    let num = input.value.replace(/[^0-9]/g, '');
    if (!num || num.length < 10) {
        return alert('කරුණාකර නිවැරදි WhatsApp අංකයක් ඇතුළත් කරන්න!');
    }

    btn.innerText = 'CONNECTING...';
    btn.disabled = true;

    try {
        const res = await fetch(`/code?number=${num}`);
        const data = await res.json();

        if (data.code) {
            codeText.innerText = data.code;
            codePanel.style.display = 'block';

            // WhatsApp එකෙන් link කළ සැනින් Session එක මෙතැනට අදිනවා
            pollSession(num);
        } else {
            alert(data.error || 'Pair Code එක ලබාගත නොහැකි විය.');
            btn.disabled = false;
            btn.innerText = 'PAIR WITH WHATSAPP';
        }
    } catch (e) {
        alert('Server Error. කරුණාකර නැවත උත්සාහ කරන්න.');
        btn.disabled = false;
        btn.innerText = 'PAIR WITH WHATSAPP';
    }
}

function pollSession(num) {
    if (timer) clearInterval(timer);
    timer = setInterval(async () => {
        try {
            const res = await fetch(`/session-status?number=${num}`);
            const data = await res.json();

            if (data.status === 'success' && data.sessionId) {
                clearInterval(timer);
                document.getElementById('codePanel').style.display = 'none';
                document.getElementById('sessionPanel').style.display = 'block';
                document.getElementById('sessionVal').value = data.sessionId;
            }
        } catch {}
    }, 2000);
}

function copyCode() {
    const code = document.getElementById('codeText').innerText;
    navigator.clipboard.writeText(code).then(() => {
        const btn = document.getElementById('copyCodeBtn');
        btn.innerText = 'COPIED!';
        setTimeout(() => btn.innerText = 'COPY CODE', 2000);
    });
}

function copySession() {
    const session = document.getElementById('sessionVal').value;
    navigator.clipboard.writeText(session).then(() => {
        alert('Session ID Copied! Paste it to your bot config.cjs');
    });
}
</script>

</body>
</html>
